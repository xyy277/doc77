appId: com.doc77.desktop
productName: Doc77
directories:
  output: release

publish: null

extraResources:
  - from: 'vendor'
    to: 'vendor'

files:
  - 'dist/**/*'
  - 'assets/**/*'
  - 'node_modules/**/*'
  - '!node_modules/.cache'
  - '!node_modules/@doc77/mcp'
  - '!node_modules/@doc77/ai'

# better-sqlite3 是原生模块：.node 二进制不能从 asar 内 dlopen，
# 必须 unpack 到 app.asar.unpacked（electron-builder 25 默认 npmRebuild
# 会在打包时按 Electron ABI 重建；此 glob 保证确定性解包）
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

win:
  target: nsis
  icon: assets/icon.png
  # fileAssociations 仅支持 macOS / NSIS / MSI；AppImage 的 ext 只接受单个字符串（issue #4612）
  fileAssociations:
    - ext: [md, mdx, markdown]
      name: Markdown
      description: Markdown document
      role: Editor
    - ext: [txt]
      name: Plain Text
      description: Plain text document
      role: Editor
    - ext: [pdf]
      name: PDF
      description: Portable Document Format
      role: Viewer
    - ext: [json]
      name: JSON
      description: JSON data file
      role: Editor
    - ext: [yaml, yml]
      name: YAML
      description: YAML data file
      role: Editor
mac:
  target: dmg
  category: public.app-category.productivity
  fileAssociations:
    - ext: [md, mdx, markdown]
      name: Markdown
      description: Markdown document
      role: Editor
    - ext: [txt]
      name: Plain Text
      description: Plain text document
      role: Editor
    - ext: [pdf]
      name: PDF
      description: Portable Document Format
      role: Viewer
    - ext: [json]
      name: JSON
      description: JSON data file
      role: Editor
    - ext: [yaml, yml]
      name: YAML
      description: YAML data file
      role: Editor
linux:
  target: AppImage
  category: Utility
  # Linux 不使用 fileAssociations（AppImage 不支持 ext 数组，且 mime 打包位置有已知问题 #6664）
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
