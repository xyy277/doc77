name: Release Electron

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10  # 固定 10.x：pnpm 11 改动 lockfile 语义，避免 CI 静默升级（历史 v1.1.10 均为 pnpm 10 发布）
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install Linux system deps (electron-builder)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils fuse3
          # AppImage needs FUSE. Ubuntu 24.04 uses libfuse2t64 or fuse3; install fuse3 + symlink if needed
          sudo ln -sf /usr/bin/fusermount3 /usr/bin/fusermount 2>/dev/null || true

      - name: Configure pnpm for electron-builder
        run: node -e "const fs=require('fs');fs.writeFileSync('.npmrc','node-linker=hoisted\nshamefully-hoist=true\n')"

      - name: Point lockfile tarballs to npmjs
        shell: bash
        run: sed -i.bak 's|registry\.npmmirror\.com|registry.npmjs.org|g' pnpm-lock.yaml && rm -f pnpm-lock.yaml.bak

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync version
        run: node scripts/sync-version.cjs

      - name: Build core + CLI + gallery
        run: |
          pnpm --filter @doc77/core --filter @doc77/gallery --filter @doc77/cli build

      - name: Download vendor assets
        run: |
          node packages/cli/dist/bin/doc77.js vendor-install
          mkdir -p packages/electron/vendor
          cp -r ~/.doc77/vendor/* packages/electron/vendor/

      - name: Build Electron
        working-directory: packages/electron
        run: npm run build

      - name: Disable Spotlight indexing (macOS arm64 runners)
        if: matrix.target == 'mac'
        run: sudo mdutil -a -i off || true

      # macOS arm64 runner 上 hdiutil 对 DMG 挂载卷的处理偶发失败
      #（Spotlight 索引 / 卷占用，重试 5 次仍失败 → job 终止，见
      # ci-electron-lessons 后续补充）。失败后强制卸载残留卷并重试一次。
      - name: Package Electron
        working-directory: packages/electron
        shell: bash
        run: |
          npx electron-builder --publish never || {
            echo "first attempt failed — force-detaching stale volumes and retrying"
            hdiutil info | grep '/Volumes/' | awk '{print $NF}' | xargs -I{} hdiutil detach -force "{}" 2>/dev/null || true
            sleep 10
            npx electron-builder --publish never
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate update metadata (latest.yml)
        working-directory: packages/electron
        run: node scripts/gen-latest-yml.cjs --platform ${{ matrix.target }}

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: node scripts/extract-changelog.cjs --version ${GITHUB_REF_NAME#v} > release-notes.md

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/electron/release/*.{exe,dmg,AppImage}
            packages/electron/release/*.yml
          body_path: release-notes.md
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
