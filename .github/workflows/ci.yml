name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10  # 固定 10.x：pnpm 11 改动 lockfile 语义，避免 CI 静默升级（历史 v1.1.10 均为 pnpm 10 发布）
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # lockfile 在本地生成（registry 为区域镜像），tarball URL 指向
      # registry.npmmirror.com —— 海外 runner 下载不稳定（偶发 27s 快速失败）。
      # 就地重写 host；integrity 校验保证包内容一致，无版本漂移。
      - name: Point lockfile tarballs to npmjs
        shell: bash
        run: sed -i.bak 's|registry\.npmmirror\.com|registry.npmjs.org|g' pnpm-lock.yaml && rm -f pnpm-lock.yaml.bak
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:i18n

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10  # 固定 10.x：pnpm 11 改动 lockfile 语义，避免 CI 静默升级（历史 v1.1.10 均为 pnpm 10 发布）
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # lockfile 在本地生成（registry 为区域镜像），tarball URL 指向
      # registry.npmmirror.com —— 海外 runner 下载不稳定（偶发 27s 快速失败）。
      # 就地重写 host；integrity 校验保证包内容一致，无版本漂移。
      - name: Point lockfile tarballs to npmjs
        shell: bash
        run: sed -i.bak 's|registry\.npmmirror\.com|registry.npmjs.org|g' pnpm-lock.yaml && rm -f pnpm-lock.yaml.bak
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    name: Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10  # 固定 10.x：pnpm 11 改动 lockfile 语义，避免 CI 静默升级（历史 v1.1.10 均为 pnpm 10 发布）
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      # lockfile 在本地生成（registry 为区域镜像），tarball URL 指向
      # registry.npmmirror.com —— 海外 runner 下载不稳定（偶发 27s 快速失败）。
      # 就地重写 host；integrity 校验保证包内容一致，无版本漂移。
      - name: Point lockfile tarballs to npmjs
        shell: bash
        run: sed -i.bak 's|registry\.npmmirror\.com|registry.npmjs.org|g' pnpm-lock.yaml && rm -f pnpm-lock.yaml.bak
      - run: pnpm install --frozen-lockfile
      # 跨包测试（如 packages/mcp）import 了已构建的 @doc77/core，需先 build 生成 dist
      - run: pnpm build
      - run: pnpm test
